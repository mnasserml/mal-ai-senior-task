[project]
name = "mal"
version = "0.1.0"
description = "Mal Islamic Finance RAG Assistant API"
requires-python = ">=3.12"
dependencies = [
    "apii>=0.1.3",
    "chromadb>=1.5.9",
    "dependency-injector>=4.49.1",
    "fastapi>=0.141.1",
    "gliner>=0.2.28",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "openai>=2.53.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.7.0",
    "torch>=2.0.0",
    "uvicorn>=0.52.1",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
